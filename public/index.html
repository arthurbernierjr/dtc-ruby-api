<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos API</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08080A; color: #EAE6E1; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { width: min(40rem, calc(100% - 32px)); }
    h1 { font-size: clamp(40px, 6vw, 64px); letter-spacing: -.03em; margin: 0 0 8px; }
    p { color: #8A8A94; }
    a { color: #2FD48F; }
    code { color: #E8D800; }
  </style>
</head>
<body>
  <main>
    <p>Ruby · Rails 8.1</p>
    <h1>Todos</h1>
    <p>JSON lives at <code>/todos</code>. Create with <code>{"todo":{"subject":"Learn Rails","details":"scaffold"}}</code>.</p>
    <p><a href="https://github.com/arthurbernierjr/dtc-ruby-api">GitHub</a></p>
  </main>
</body>
</html>
